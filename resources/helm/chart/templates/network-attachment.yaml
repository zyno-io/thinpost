{{- if eq .Values.workload "edge" }}
{{- /*
One attachment per address in the addresses list. Entry 0 is thinpost-public on
net1; entry N is thinpost-public-N on net{N+1}. Each has its own single-address
Whereabouts range, its own gateway and its own source-based routing table
(publicNetwork.table + N), so addresses in different networks leave through
their own gateways. Entries may override range, gateway, master and mtu; the
defaults are the publicNetwork values. These names and interfaces stay fixed so
existing Multus attachments do not change.
*/ -}}
{{- range $i, $entry := .Values.addresses }}
{{- $name := "thinpost-public" }}
{{- if gt $i 0 }}{{ $name = printf "thinpost-public-%d" $i }}{{ end }}
{{- $table := add (int $.Values.publicNetwork.table) $i }}
{{- $gateway := default $.Values.publicNetwork.gateway $entry.gateway }}
{{- if gt $i 0 }}
---
{{ end }}apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
{{- with $.Values.publicNetwork.attachmentLabels }}
  labels:
{{ toYaml . | indent 4 }}
{{- end }}
spec:
  config: |-
    {
      "cniVersion": "1.1.0",
      "name": {{ $name | quote }},
      "plugins": [
        {
          "type": {{ $.Values.publicNetwork.cniTypes.ipvlan | quote }},
          "master": {{ default $.Values.publicNetwork.master $entry.master | quote }},
          "mode": "l2",
          "mtu": {{ int (default $.Values.publicNetwork.mtu $entry.mtu) }},
          "ipam": {
            "type": "whereabouts",
            "range": {{ default $.Values.publicNetwork.range $entry.range | quote }},
            "range_start": {{ $entry.address | quote }},
            "range_end": {{ $entry.address | quote }},
            "gateway": {{ $gateway | quote }},
            "routes": [
              {"dst": {{ printf "%s/32" $gateway | quote }}, "gw": "0.0.0.0", "table": {{ $table }}, "scope": 253},
              {"dst": "0.0.0.0/0", "gw": {{ $gateway | quote }}, "table": {{ $table }} }
            ]
          }
        },
        {"type": {{ $.Values.publicNetwork.cniTypes.sbr | quote }}, "table": {{ $table }} }
      ]
    }
{{- end }}
{{- end }}
