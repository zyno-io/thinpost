{{- if not (has .Values.workload (list "control" "edge")) }}
{{- fail "workload must be control or edge" }}
{{- end }}
{{- if and (eq .Values.workload "control") (and (ne (int .Values.control.replicas) 0) (lt (int .Values.control.replicas) 2)) }}
{{- fail "control requires zero or at least two replicas" }}
{{- end }}
{{- if and (eq .Values.workload "control") .Values.control.reloader.enabled (hasKey (default dict .Values.control.deploymentAnnotations) "secret.reloader.stakater.com/reload") }}
{{- fail "set control.reloader.enabled=false to supply secret.reloader.stakater.com/reload in control.deploymentAnnotations" }}
{{- end }}
{{- if and (eq .Values.workload "control") (not (toString .Values.database.caConfigMap)) }}
{{- fail "database.caConfigMap is required for control" }}
{{- end }}
{{- if and (eq .Values.workload "control") .Values.control.tls.enabled }}
{{- if not (toString .Values.control.tls.secretName) }}
{{- fail "control.tls.secretName is required when control.tls.enabled" }}
{{- end }}
{{- if eq (int .Values.control.tls.port) 8080 }}
{{- fail "control.tls.port must differ from the plain HTTP port 8080" }}
{{- end }}
{{- end }}
{{- if eq .Values.workload "control" }}
{{- /* Internal webhook exceptions: canonical http(s) URLs (no commas, spaces or credentials) that the control binary re-validates, and Service CIDRs that must accompany them. */ -}}
{{- if and .Values.control.webhookInternalDestinations (not .Values.control.serviceCidrs) }}
{{- fail "control.webhookInternalDestinations requires control.serviceCidrs" }}
{{- end }}
{{- range .Values.control.webhookInternalDestinations }}
{{- if not (regexMatch "^https?://[a-z0-9-]+\\.[a-z0-9.-]+\\.svc\\.cluster\\.local(:[0-9]{1,5})?(/[^,#\\s]*)?(\\?[^,#\\s]*)?$" (toString .)) }}
{{- fail "control.webhookInternalDestinations entries must be http(s) URLs with a lowercase <service>.<namespace>.svc.cluster.local host, no credentials, fragment, comma or space" }}
{{- end }}
{{- end }}
{{- range .Values.control.serviceCidrs }}
{{- if not (regexMatch "^([0-9]{1,3}(\\.[0-9]{1,3}){3}/[0-9]{1,2}|[0-9a-f:]+/[0-9]{1,3})$" (toString .)) }}
{{- fail "control.serviceCidrs entries must be CIDRs" }}
{{- end }}
{{- end }}
{{- end }}
{{- if eq .Values.workload "edge" }}
{{- /* The addresses list: 1-16 maps with unique IPv4 addresses and unique hostnames, one routing table per attachment. The first entry is the main IP. */ -}}
{{- $legacy := list }}
{{- range $key := list "sourceAddress" "smtpHostname" "bounceDomain" "additionalSources" "additionalBounceDomains" }}
{{- if hasKey $.Values $key }}{{ $legacy = append $legacy $key }}{{ end }}
{{- end }}
{{- if and (empty .Values.addresses) $legacy }}
{{- fail (printf "the values %s were replaced by a single addresses list. Move sourceAddress and smtpHostname into the first entry (address, hostname) and each additionalSources entry after it; bounceDomain and additionalBounceDomains are no longer used (bounces arrive at each entry's hostname). See the Helm: Edge page in the deployment docs." (join ", " $legacy)) }}
{{- end }}
{{- if empty .Values.addresses }}
{{- fail "addresses is required for the Edge: list at least one entry with an address and a hostname (the first entry is the main IP)" }}
{{- end }}
{{- /* While both shapes are set (the old chart reads only the legacy keys, this one only addresses), they must describe the same attachments, or switching charts would silently change the Edge's addresses. */ -}}
{{- if or (hasKey .Values "sourceAddress") (hasKey .Values "smtpHostname") (hasKey .Values "additionalSources") }}
{{- $old := list (dict "address" .Values.sourceAddress "hostname" .Values.smtpHostname) }}
{{- range (default list .Values.additionalSources) }}{{ $old = append $old . }}{{ end }}
{{- if ne (len $old) (len .Values.addresses) }}
{{- fail (printf "addresses has %d entries but the legacy sourceAddress and additionalSources describe %d; while both are set they must match entry for entry" (len .Values.addresses) (len $old)) }}
{{- end }}
{{- range $i, $new := .Values.addresses }}
{{- $was := index $old $i }}
{{- if not (kindIs "map" $new) }}{{ fail "each addresses entry must be a map with an address and a hostname" }}{{ end }}
{{- range $key := list "address" "hostname" "range" "gateway" "master" "mtu" "certificateSecret" }}
{{- $a := toString (default "" (get $was $key)) }}
{{- $b := toString (default "" (get $new $key)) }}
{{- if and (eq $i 0) (eq $key "certificateSecret") }}{{ $a = default "thinpost-smtp-public" $a }}{{ $b = default "thinpost-smtp-public" $b }}{{ end }}
{{- if ne $a $b }}
{{- fail (printf "addresses entry %d %s is %q but the legacy values say %q; while both are set they must match" $i $key $b $a) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- $ipv4 := "^((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])$" }}
{{- if gt (len .Values.addresses) 16 }}
{{- fail "addresses supports at most 16 entries" }}
{{- end }}
{{- if gt (add (int .Values.publicNetwork.table) (sub (len .Values.addresses) 1)) 252 }}
{{- fail "publicNetwork.table plus the number of addresses minus one must be at most 252" }}
{{- end }}
{{- $dnsName := "^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\\.)+[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$" }}
{{- $secretName := "^[a-z0-9]([-a-z0-9]{0,251}[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]{0,251}[a-z0-9])?)*$" }}
{{- $seen := dict }}
{{- $names := dict }}
{{- range .Values.addresses }}
{{- if not (kindIs "map" .) }}
{{- fail "each addresses entry must be a map with an address and a hostname" }}
{{- end }}
{{- $address := toString (default "" .address) }}
{{- if not (regexMatch $ipv4 $address) }}
{{- fail "each addresses entry needs an address that is an IPv4 literal" }}
{{- end }}
{{- if hasKey $seen $address }}
{{- fail "addresses must be unique" }}
{{- end }}
{{- $_ := set $seen $address true }}
{{- $hostname := toString (default "" .hostname) }}
{{- if or (not (regexMatch $dnsName $hostname)) (gt (len $hostname) 219) }}
{{- fail "each addresses entry needs a hostname: a lowercase DNS name of at most 219 characters" }}
{{- end }}
{{- if hasKey $names $hostname }}
{{- fail "addresses hostnames must be unique" }}
{{- end }}
{{- $_ := set $names $hostname true }}
{{- $secret := toString (default "thinpost-smtp-public" .certificateSecret) }}
{{- if or (not (regexMatch $secretName $secret)) (gt (len $secret) 253) }}
{{- fail "addresses certificateSecret must be a Kubernetes Secret name" }}
{{- end }}
{{- end }}
{{- end }}
{{- if and (eq .Values.workload "edge") .Values.smtpSubmission.internal.enabled }}
{{- /* The internal listener needs its certificate name, a sane Secret and port, and at least one allowed client source: an open listener is never rendered. */ -}}
{{- $internal := .Values.smtpSubmission.internal }}
{{- if or (not (regexMatch "^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\\.)+[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$" (toString $internal.hostname))) (gt (len (toString $internal.hostname)) 219) }}
{{- fail "smtpSubmission.internal.hostname must be a lowercase DNS name of at most 219 characters when the internal listener is enabled" }}
{{- end }}
{{- if or (not (regexMatch "^[a-z0-9]([-a-z0-9]{0,251}[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]{0,251}[a-z0-9])?)*$" (toString $internal.certificateSecret))) (gt (len (toString $internal.certificateSecret)) 253) }}
{{- fail "smtpSubmission.internal.certificateSecret must be a Kubernetes Secret name" }}
{{- end }}
{{- if or (lt (int $internal.port) 1) (gt (int $internal.port) 65535) (has (int $internal.port) (list 25 7443)) }}
{{- fail "smtpSubmission.internal.port must be 1-65535 and not 25 or 7443" }}
{{- end }}
{{- if and .Values.smtpSubmission.enabled (has (int $internal.port) (list 465 587)) }}
{{- fail "smtpSubmission.internal.port must differ from 465 and 587 while smtpSubmission.enabled (they are already container ports)" }}
{{- end }}
{{- if and (empty $internal.clientCidrs) (empty $internal.clientNamespaceSelector) }}
{{- fail "smtpSubmission.internal needs clientCidrs and/or clientNamespaceSelector" }}
{{- end }}
{{- range $internal.clientCidrs }}
{{- if not (regexMatch "^([0-9]{1,3}(\\.[0-9]{1,3}){3}/[0-9]{1,2}|[0-9a-f:]+/[0-9]{1,3})$" (toString .)) }}
{{- fail "smtpSubmission.internal.clientCidrs entries must be CIDRs" }}
{{- end }}
{{- end }}
{{- end }}
