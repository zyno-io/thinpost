{{- if eq .Values.workload "edge" }}
# This policy covers only the primary Cilium interface. Router policy must
# protect the direct-public Multus interface independently. The private control
# Service preserves the source; permit only the configured router gateway peers.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: thinpost-edge-worker
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: thinpost-edge-worker
  policyTypes:
    - Ingress
    - Egress
{{- if or .Values.controlClientCidrs .Values.smtpSubmission.internal.enabled }}
  ingress:
{{- end }}
{{- if .Values.controlClientCidrs }}
    - from:
{{- range .Values.controlClientCidrs }}
{{- /* An IPv4 network address with a /1 to /32 prefix and no host bits set. */ -}}
{{- $cidr := toString . }}
{{- if not (regexMatch "^((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])/([1-9]|[12][0-9]|3[0-2])$" $cidr) }}
{{- fail (printf "controlClientCidrs entry %q must be an IPv4 CIDR with a /1 to /32 prefix" $cidr) }}
{{- end }}
{{- $parts := split "/" $cidr }}
{{- $address := 0 }}
{{- range splitList "." $parts._0 }}
{{- $address = add (mul $address 256) (atoi .) }}
{{- end }}
{{- $size := 1 }}
{{- range until (sub 32 (atoi $parts._1) | int) }}
{{- $size = mul $size 2 }}
{{- end }}
{{- if ne (mod $address $size) 0 }}
{{- fail (printf "controlClientCidrs entry %q has host bits set; use the network address" $cidr) }}
{{- end }}
        - ipBlock:
            cidr: {{ $cidr | quote }}
{{- end }}
      ports:
        - port: 7443
          protocol: TCP
{{- end }}
{{- if .Values.smtpSubmission.internal.enabled }}
    # In-cluster submission clients only; the public submission ports are on the
    # direct-public interface, which router policy protects.
    - from:
{{- range .Values.smtpSubmission.internal.clientCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
{{- end }}
{{- if .Values.smtpSubmission.internal.clientNamespaceSelector }}
        - namespaceSelector:
{{ toYaml .Values.smtpSubmission.internal.clientNamespaceSelector | indent 12 }}
{{- end }}
      ports:
        - port: {{ int .Values.smtpSubmission.internal.port }}
          protocol: TCP
{{- end }}

{{- end }}
