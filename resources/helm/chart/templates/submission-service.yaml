{{- if and (eq .Values.workload "edge") .Values.smtpSubmission.internal.enabled }}
# In-cluster submission: thinpost-edge-submission.<namespace>.svc:587. Reachable
# only from the clients the NetworkPolicy allows.
apiVersion: v1
kind: Service
metadata:
  name: thinpost-edge-submission
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: thinpost-edge-worker
  ports:
    - name: submission
      port: 587
      targetPort: submission-int
      protocol: TCP
{{- end }}
