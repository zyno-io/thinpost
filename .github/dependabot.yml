version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    groups:
      npm-ui-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: /tests/sdk-contract
    schedule:
      interval: weekly
    groups:
      npm-tests-sdk-contract-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    groups:
      npm-docs-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: docker
    directory: /examples/quickstart
    schedule:
      interval: weekly
    groups:
      docker-examples-quickstart-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    groups:
      docker-compose-minor-patch:
        update-types:
          - minor
          - patch
