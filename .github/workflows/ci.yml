name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Every push to main gets its own group so no main build is superseded.
  group: ci-${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: "1.27"
  CONTROL_IMAGE: ghcr.io/zyno-io/thinpost-control
  EDGE_IMAGE: ghcr.io/zyno-io/thinpost-edge

jobs:
  go:
    name: Go tests (PostgreSQL ${{ matrix.pg }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Production runs PostgreSQL 18; 17 stays covered for upgrades.
        pg: ["17", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}-alpine
        env:
          POSTGRES_DB: thinpost_fixture
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable_ci_password
        ports: ["15432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-retries 30
      object-storage:
        image: ministackorg/ministack:1.5.42
        env:
          SERVICES: s3
        ports: ["14566:4566"]
    env:
      # Synthetic, disposable credentials; the fixture guard requires numeric
      # loopback, the database name and this explicit opt-in.
      THINPOST_TEST_DATABASE_URL: postgres://postgres:disposable_ci_password@127.0.0.1:15432/thinpost_fixture?sslmode=disable
      THINPOST_TEST_DISPOSABLE_DB: "1"
      THINPOST_TEST_S3_ENDPOINT: 127.0.0.1:14566
      # Matches the production build, which is CGO-free.
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Wait for object storage
        run: |
          for _ in $(seq 1 60); do
            if curl -s -o /dev/null "http://127.0.0.1:14566/"; then exit 0; fi
            sleep 1
          done
          echo "object storage did not become ready" >&2
          exit 1
      # Fixture tests change database-wide grants, so packages must not race
      # each other's setup and cleanup on the one database.
      - name: Test
        run: go test -p 1 ./...
      - name: Vet
        run: go vet ./...
      # This test is skipped unless the process is root (it changes file owners).
      - name: Privileged journal ownership test
        run: >-
          sudo -E env "PATH=$PATH" "HOME=$HOME"
          go test -count=1 ./internal/journal -run TestJournalOpenRejectsAnotherOwner -v

  hygiene:
    name: Hygiene and leak checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: Leak checker self-test
        run: python3 scripts/leak-check.py --self-test
      - name: Public leak check
        run: python3 scripts/leak-check.py
      - name: Install gitleaks
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: Scan for secrets
        run: gitleaks dir . --config .gitleaks.toml --no-banner --redact
      - name: Configuration reference is in sync
        run: python3 scripts/check-config-docs.py
      - name: Helm values reference is in sync
        run: python3 scripts/check-helm-values-docs.py

  proto:
    name: Protobuf drift
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PROTOC_VERSION: "36.2"
      PROTOC_SHA256: 121f6c7afe1d4d0e3ea6aab9432038599250134cbf4474cb1167d2c7decd4278
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install pinned generators
        run: |
          set -euo pipefail
          archive="protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/$archive"
          echo "${PROTOC_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/protoc"
          unzip -q "$RUNNER_TEMP/$archive" -d "$RUNNER_TEMP/protoc"
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Regenerate and compare
        run: |
          sh scripts/gen-proto.sh
          git diff --exit-code -- api/control

  helm:
    name: Helm chart
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install-helm
      - name: Lint
        run: |
          helm lint resources/helm/chart --set workload=edge
          helm lint resources/helm/chart --set workload=control --set control.image=example.invalid/control:test
      # Lints every variant and asserts the migration hook rendering contract.
      - name: Chart assertions
        run: sh scripts/test-helm-chart.sh

  ui:
    name: Operator console
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/.node-version
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build

  sdk-contract:
    name: SDK contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/.node-version
          cache: npm
          cache-dependency-path: tests/sdk-contract/package-lock.json
      - name: Build the fixture server
        run: CGO_ENABLED=0 go build -o tests/sdk-contract/fixture-server ./tests/sdk-contract/fixture
      - name: Install test dependencies
        working-directory: tests/sdk-contract
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run contract tests
        working-directory: tests/sdk-contract
        run: env -i PATH="$PATH" HOME=/tmp THINPOST_SDK_FIXTURE_BINARY=./fixture-server npm test

  # Build only: pull requests, manual runs and anything that is not a push to
  # main. No write permissions and no registry login.
  images:
    name: Build image ${{ matrix.target }}
    if: github.ref_type != 'tag' && !(github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [go, hygiene, proto, helm, ui, sdk-contract]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [control, edge]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runtime stages only copy files, so arm64 needs no emulation; Go is
      # cross-compiled on the build platform.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: false
          labels: |
            org.opencontainers.image.title=thinpost-${{ matrix.target }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}

  # Publish: only on a push to main, with the only write permissions in this
  # workflow besides the release job.
  publish-images:
    name: Publish image ${{ matrix.target }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [go, hygiene, proto, helm, ui, sdk-contract]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [control, edge]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/zyno-io/thinpost-${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # :main moves only while this commit is still the tip of main, so a
      # slow older build never overwrites a newer one. The immutable
      # sha-<commit> tag is always pushed.
      - name: Choose tags
        id: tags
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          {
            echo "list<<EOF"
            echo "$IMAGE:sha-$GITHUB_SHA"
            if [[ "$(git rev-parse FETCH_HEAD)" == "$GITHUB_SHA" ]]; then
              echo "$IMAGE:main"
            else
              echo "main has moved past $GITHUB_SHA; not moving :main" >&2
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.title=thinpost-${{ matrix.target }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      # Attestations are unavailable for private repositories on the GitHub
      # Free plan. The release job refuses to promote images without one, so
      # the first usable release is a main build made after the repository
      # goes public.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release:
    name: Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    # No images dependency: tag runs skip the build and promote the main
    # build of the same commit.
    needs: [go, hygiene, proto, helm, ui, sdk-contract]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Validate the tag and credentials
        id: version
        env:
          CHARTS_TOKEN: ${{ secrets.GH_DEPLOY_PAT }}
        run: |
          set -euo pipefail
          if [[ -z "$CHARTS_TOKEN" ]]; then
            echo "GH_DEPLOY_PAT must have Contents read/write access to zyno-io/charts." >&2
            exit 1
          fi
          push="$(GH_TOKEN="$CHARTS_TOKEN" gh api repos/zyno-io/charts --jq .permissions.push)"
          if [[ "$push" != "true" ]]; then
            echo "GH_DEPLOY_PAT cannot push to zyno-io/charts." >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          semver='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ "$version" == "$RELEASE_TAG" || ! "$version" =~ $semver ]]; then
            echo "Release tags must look like v1.2.3 or v1.2.3-rc.1; got $RELEASE_TAG." >&2
            exit 1
          fi
          # The commit must already be on main, where CI built its images.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$GITHUB_SHA is not an ancestor of origin/main." >&2
            exit 1
          fi
          minor="${version%.*}"
          prerelease=false
          latest=false
          minor_latest=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          else
            # Only the highest stable tag moves latest, and only the highest
            # stable tag of a minor series moves X.Y.
            highest="$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)"
            [[ "$highest" == "$RELEASE_TAG" ]] && latest=true
            highest_minor="$(git tag -l "v${minor}.*" --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)"
            [[ "$highest_minor" == "$RELEASE_TAG" ]] && minor_latest=true
          fi
          {
            echo "version=$version"
            echo "minor=$minor"
            echo "prerelease=$prerelease"
            echo "latest=$latest"
            echo "minor_latest=$minor_latest"
          } >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Resolve and verify both images before promoting either, so a missing
      # attestation or a conflicting release tag never leaves a half release.
      - name: Resolve and verify images
        id: images
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for target in control edge; do
            image="ghcr.io/zyno-io/thinpost-$target"
            source_ref="$image:sha-$GITHUB_SHA"
            if ! digest="$(docker buildx imagetools inspect "$source_ref" --format '{{.Manifest.Digest}}')"; then
              echo "$source_ref does not exist. Wait for the main build of this commit and re-run." >&2
              exit 1
            fi
            gh attestation verify "oci://$image@$digest" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
              --source-ref refs/heads/main \
              --source-digest "$GITHUB_SHA"
            # Only a genuine "not found" means the release tag is free; any
            # other registry error fails the job.
            if out="$(docker buildx imagetools inspect "$image:v$VERSION" --format '{{.Manifest.Digest}}' 2>&1)"; then
              if [[ "$out" != "$digest" ]]; then
                echo "$image:v$VERSION already exists with digest $out, not $digest." >&2
                exit 1
              fi
            elif ! grep -qiE 'not found|manifest unknown|name unknown' <<<"$out"; then
              echo "Could not look up $image:v$VERSION: $out" >&2
              exit 1
            fi
            echo "${target}_digest=$digest" >> "$GITHUB_OUTPUT"
          done
      # Promote by digest. Nothing is rebuilt, so the release tags point at the
      # exact bytes CI built and attested on main.
      - name: Promote images
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MINOR: ${{ steps.version.outputs.minor }}
          LATEST: ${{ steps.version.outputs.latest }}
          MINOR_LATEST: ${{ steps.version.outputs.minor_latest }}
          CONTROL_DIGEST: ${{ steps.images.outputs.control_digest }}
          EDGE_DIGEST: ${{ steps.images.outputs.edge_digest }}
        run: |
          set -euo pipefail
          for target in control edge; do
            image="ghcr.io/zyno-io/thinpost-$target"
            digest_var="${target^^}_DIGEST"
            digest="${!digest_var}"
            tags=(-t "$image:v$VERSION")
            [[ "$MINOR_LATEST" == "true" ]] && tags+=(-t "$image:$MINOR")
            [[ "$LATEST" == "true" ]] && tags+=(-t "$image:latest")
            docker buildx imagetools create "${tags[@]}" "$image@$digest"
            echo "Promoted $image@$digest as v$VERSION"
          done
      - uses: ./.github/actions/install-helm
      - name: Package the chart
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Fixed mtimes keep the package byte-identical across re-runs.
          find resources/helm/chart -exec touch -h -d "@$(git log -1 --format=%ct)" {} +
          mkdir -p dist
          helm package resources/helm/chart --destination dist \
            --version "$VERSION" --app-version "v$VERSION"
          (cd dist && sha256sum ./*.tgz > SHA256SUMS)
      # Same pattern as the other zyno-io charts: a release asset on
      # zyno-io/charts. Re-runs compare bytes instead of overwriting.
      - name: Publish the chart to zyno-io/charts
        env:
          GH_TOKEN: ${{ secrets.GH_DEPLOY_PAT }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          REPO=zyno-io/charts TAG="thinpost-$VERSION" TITLE="thinpost $VERSION" \
          NOTES="Thinpost Helm chart $VERSION, published from zyno-io/thinpost tag $RELEASE_TAG." \
          PRERELEASE=false VERIFY_TAG=false \
            .github/scripts/release-assets.sh "dist/thinpost-$VERSION.tgz"
      - name: Create the GitHub release
        env:
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          REPO="$GITHUB_REPOSITORY" TAG="$RELEASE_TAG" TITLE="Thinpost $RELEASE_TAG" \
          NOTES="" VERIFY_TAG=true \
            .github/scripts/release-assets.sh dist/*
