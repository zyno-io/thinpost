name: quickstart

# End-to-end proof of the Docker Compose quickstart: build, start the whole
# stack, send a message and check it arrives DKIM-signed.
on:
  pull_request:
    paths:
      - compose.yaml
      - examples/quickstart/**
      - Dockerfile
      - cmd/**
      - internal/**
      - api/**
      - ui/**
      - go.mod
      - go.sum
      - .github/workflows/quickstart.yml
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quickstart-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quickstart:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start the stack
        run: docker compose up -d --build --wait
      - name: Smoke test
        run: examples/quickstart/smoke.sh
      - name: Logs on failure
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
