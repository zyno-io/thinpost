# Source: thinpost/templates/network-attachment.yaml
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: thinpost-public
  namespace: thinpost-edge
  labels:
    tier: public
spec:
  config: |-
    {
      "cniVersion": "1.1.0",
      "name": "thinpost-public",
      "plugins": [
        {
          "type": "ipvlan-custom",
          "master": "ens18",
          "mode": "l2",
          "mtu": 1400,
          "ipam": {
            "type": "whereabouts",
            "range": "198.51.100.0/24",
            "range_start": "198.51.100.10",
            "range_end": "198.51.100.10",
            "gateway": "198.51.100.1",
            "routes": [
              {"dst": "198.51.100.1/32", "gw": "0.0.0.0", "table": 150, "scope": 253},
              {"dst": "0.0.0.0/0", "gw": "198.51.100.1", "table": 150 }
            ]
          }
        },
        {"type": "sbr-custom", "table": 150 }
      ]
    }
