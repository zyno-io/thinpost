openapi: 3.1.0
info:
  title: Thinpost app API
  version: 0.3.0
  description: >-
    Thinpost's own routes for the submission API key of an app: sending a
    message, and reads, release and cancel of a message (release and cancel for
    one submitted on hold). They are served by the control process on the same
    listener as the provider submission routes and only when submission is
    configured. The key identifies the app; a message of another app is reported
    as not found. Sending is a submission like the provider routes (POST
    /emails and the rest): the same acceptance path, quotas, submission rate,
    sender-domain verification and recipient policy apply. Reads use the admin
    API's schemas and security headers. Sending needs the route to be reachable
    by the sender, so a deployment that exposes the provider submission routes
    publicly must also expose POST /app/v1/messages; the other routes are
    intended for in-cluster callers and need not be exposed. Reads are GET and
    sending and the hold actions POST; a query string is rejected. Errors are
    {"error": "<status text>"}, except that a hold action that cannot apply
    answers 409 with a reason code in error, and a refused send carries the
    codes of SubmissionRefusal.
servers:
  - url: /app/v1
security:
  - appKey: []
paths:
  /messages:
    post:
      operationId: sendMessage
      description: >-
        Submits one message as the app. The body is strict JSON: duplicate or
        unknown fields, trailing data and null optional objects are rejected.
        Recipient fields are arrays. Options that provider APIs take as
        X-Thinpost-* headers (hold, Enhanced Protection, tracking) are body fields
        here, and sending those headers is a 400. An Idempotency-Key makes a retry
        return the original message (200, same body) for 24 hours, scoped to the
        app and this route; reusing a key with a different request is a 409. The
        permitted headers are List-Unsubscribe, List-Unsubscribe-Post,
        In-Reply-To and References; reply addresses are reply_to. A message
        submitted with hold: true is stored but not sent until released (see
        releaseMessage) and the response carries X-Thinpost-Hold: held. The
        console's test-send options bypass_limits and bypass_recipient_policy
        are operator-only and are not accepted here: either field, even false,
        is a 400.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: 1 to 256 bytes of UTF-8 without NUL; sent at most once.
          schema: { type: string, minLength: 1, maxLength: 256 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendMessageRequest' }
      responses:
        '201':
          description: Accepted and queued
          headers:
            Location: { schema: { type: string }, description: 'The message, /app/v1/messages/{messageId}' }
            X-Thinpost-Hold: { schema: { type: string, const: held }, description: Present when the request set hold }
          content:
            application/json:
              schema: { $ref: '../admin/openapi.yaml#/components/schemas/SubmittedMessage' }
        '200':
          description: An Idempotency-Key retry; the original message, nothing new queued
          headers:
            Location: { schema: { type: string } }
            X-Thinpost-Hold: { schema: { type: string, const: held }, description: Present when the request set hold }
          content:
            application/json:
              schema: { $ref: '../admin/openapi.yaml#/components/schemas/SubmittedMessage' }
        '400':
          description: Malformed, oversized or unsupported request, a query string, or an X-Thinpost-* option header
          content: { application/json: { schema: { $ref: '#/components/schemas/SubmissionRefusal' } } }
        '401':
          description: Missing, malformed, wrong or revoked app key, or a paused app
          content: { application/json: { schema: { $ref: '#/components/schemas/SubmissionRefusal' } } }
        '404':
          description: A percent-encoded path; the route has one canonical spelling
          content: { application/json: { schema: { $ref: '#/components/schemas/SubmissionRefusal' } } }
        '405':
          description: Only POST is served; Allow names it
          content: { application/json: { schema: { $ref: '#/components/schemas/SubmissionRefusal' } } }
        '408':
          description: The request body was not received in time; safe to retry with the same Idempotency-Key
          content: { application/json: { schema: { $ref: '#/components/schemas/SubmissionRefusal' } } }
        '409':
          description: idempotency_conflict
          content: { application/json: { schema: { $ref: '#/components/schemas/SubmissionRefusal' } } }
        '422':
          description: >-
            Acceptance refused the message (message_rejected): for example a From
            domain that is not an active verified sender domain of the app, a
            recipient the operator's recipient policy does not allow, or a
            List-Unsubscribe header on an app with Thinpost-managed unsubscribe.
          content: { application/json: { schema: { $ref: '#/components/schemas/SubmissionRefusal' } } }
        '429':
          description: recipient_quota_exceeded, submission_rate_exceeded or pending_limit_exceeded
          content: { application/json: { schema: { $ref: '#/components/schemas/SubmissionRefusal' } } }
        '503':
          description: Submission, authentication, database or object storage unavailable, or the admission gate is closed; Retry-After 5 accompanies a busy request budget
          content: { application/json: { schema: { $ref: '#/components/schemas/SubmissionRefusal' } } }
  /messages/{messageId}:
    parameters:
      - $ref: '#/components/parameters/MessageId'
    get:
      operationId: getMessage
      description: >-
        Same body as the operator API's getAppMessage: metadata, all recorded
        recipients and delivery states, no bodies. Not audited; the subject of an
        Enhanced Protection message is withheld.
      responses:
        '200':
          description: Message detail
          headers: { Cache-Control: { schema: { type: string, const: no-store } } }
          content:
            application/json:
              schema:
                type: object
                required: [message, deliveries]
                properties:
                  message: { $ref: '../admin/openapi.yaml#/components/schemas/MessageSummary' }
                  deliveries:
                    type: array
                    items: { $ref: '../admin/openapi.yaml#/components/schemas/DeliverySummary' }
                  preparation_failure:
                    type: object
                    description: Present when preparation is held; the reason never contains message content.
                    required: [attempts, reason]
                    properties:
                      attempts: { type: integer, minimum: 1, maximum: 12 }
                      reason: { type: string }
                  hold: { $ref: '../admin/openapi.yaml#/components/schemas/MessageHold' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /messages/{messageId}/body:
    parameters:
      - $ref: '#/components/parameters/MessageId'
    get:
      operationId: getMessageBody
      description: >-
        Source message contents with attachment metadata, as the operator API's
        getAppMessageBody. An Enhanced Protection message commits a
        message.body.read audit record (actor key:<keyId>) before the object is
        read. Outbound content is readable until Thinpost's content expiry. A
        message submitted as raw MIME over SMTP has raw: true and no attachments;
        its original is downloadable from the console only.
      responses:
        '200':
          description: Source message contents; sensitive and not cacheable
          headers: { Cache-Control: { schema: { type: string, const: no-store } } }
          content:
            application/json:
              schema: { $ref: '../admin/openapi.yaml#/components/schemas/MessageBody' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { description: The content cannot be read for this message }
        '503': { $ref: '#/components/responses/Unavailable' }
  /messages/{messageId}/attachments/{index}:
    parameters:
      - $ref: '#/components/parameters/MessageId'
      - name: index
        in: path
        required: true
        schema: { type: integer, minimum: 0, maximum: 19 }
    get:
      operationId: downloadMessageAttachment
      description: >-
        Submitted attachment bytes, always application/octet-stream, with the
        operator API's downloadAppMessageAttachment headers. Audited
        (message.attachment.read) before bytes are sent for Enhanced Protection
        messages. A non-canonical index (sign, leading zero) is 404.
      responses:
        '200':
          description: Attachment bytes
          headers:
            Content-Disposition: { schema: { type: string }, description: attachment with an RFC 2231 filename }
            Cache-Control: { schema: { type: string, const: no-store } }
            X-Content-Type-Options: { schema: { type: string, const: nosniff } }
            Cross-Origin-Resource-Policy: { schema: { type: string, const: same-origin } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /messages/{messageId}/release:
    parameters:
      - $ref: '#/components/parameters/MessageId'
    post:
      operationId: releaseMessage
      description: >-
        Queues a message submitted on hold for normal preparation and delivery,
        exactly once. Idempotent: releasing an already released message answers
        200 with its current state and queues nothing. Concurrent releases and a
        release racing a cancel or the hold expiry are serialized on the message,
        so exactly one takes effect. The app must be active and the key
        unrevoked at release; every check that precedes an SMTP attempt
        (sender-domain verification, suppression, recipient rules) still runs
        after release. A release that changes the message is audited
        (message.hold.released, actor key:<keyId>) and creates a released webhook
        event. No request body; a query string is rejected.
      responses:
        '200': { $ref: '#/components/responses/HoldResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/HoldConflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /messages/{messageId}/cancel:
    parameters:
      - $ref: '#/components/parameters/MessageId'
    post:
      operationId: cancelMessage
      description: >-
        Ends a message submitted on hold without sending it (state cancelled).
        Idempotent: cancelling an already cancelled message answers 200. A
        released message cannot be cancelled. A cancel that changes the message
        is audited (message.hold.cancelled, actor key:<keyId>) and creates a
        cancelled webhook event. No request body; a query string is rejected.
      responses:
        '200': { $ref: '#/components/responses/HoldResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/HoldConflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
components:
  securitySchemes:
    appKey:
      type: http
      scheme: bearer
      description: A submission API key of the app, as for POST /emails (Authorization header only).
  parameters:
    MessageId:
      name: messageId
      in: path
      required: true
      description: The 32-hex message ID, or a provider rendering of it that needs no percent-encoding (UUID text, id@domain); `<id@domain>` would need encoding and is rejected.
      schema: { type: string }
  responses:
    BadRequest: { description: A query string was supplied, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Unauthorized: { description: Missing, malformed, wrong or revoked app key, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: Unknown message, another app's message, malformed ID or path, or non-canonical attachment index, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    MethodNotAllowed: { description: 'Only GET is served on read routes and only POST on release and cancel; Allow names the method', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    HoldResult:
      description: The message after the action, in the getMessage body
      headers: { Cache-Control: { schema: { type: string, const: no-store } } }
      content:
        application/json:
          schema:
            type: object
            required: [message, deliveries, hold]
            properties:
              message: { $ref: '../admin/openapi.yaml#/components/schemas/MessageSummary' }
              deliveries:
                type: array
                items: { $ref: '../admin/openapi.yaml#/components/schemas/DeliverySummary' }
              hold: { $ref: '../admin/openapi.yaml#/components/schemas/MessageHold' }
    HoldConflict:
      description: >-
        The action cannot apply. not_held: the message was not submitted on hold.
        released: cancel of a released message. cancelled: release of a cancelled
        message. hold_expired: the hold passed its expires_at (a release or
        cancel after that time expires the message if the periodic check has not
        yet). recovery_hold: the message was quarantined by a database recovery.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string, enum: [not_held, released, cancelled, hold_expired, recovery_hold] }
    Unavailable: { description: 'Submission, authentication, database or object storage unavailable, the admission gate is closed, or (body and attachment) the read budget is busy; Retry-After 5 accompanies the busy case', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  schemas:
    SubmissionRefusal:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum:
            - Bad Request
            - Unauthorized
            - Not Found
            - Method Not Allowed
            - Request Timeout
            - app_paused
            - idempotency_conflict
            - message_rejected
            - recipient_quota_exceeded
            - submission_rate_exceeded
            - pending_limit_exceeded
            - Service Unavailable
    SendMessageRequest:
      type: object
      additionalProperties: false
      required: [from, to, subject]
      description: At least one of text and html is required.
      properties:
        from: { type: string, minLength: 1, description: 'An address, optionally with a display name ("Name <sender@example.com>").' }
        to: { type: array, minItems: 1, items: { type: string }, description: To, Cc and Bcc together at most 100. }
        cc: { type: array, items: { type: string } }
        bcc: { type: array, items: { type: string } }
        reply_to: { type: array, maxItems: 10, items: { type: string } }
        subject: { type: string, minLength: 1, description: At most 998 UTF-8 bytes; no control characters other than tab. }
        text: { type: string }
        html: { type: string }
        headers:
          type: object
          description: >-
            At most these headers, each once and case-insensitive. Reply-To is
            not accepted here; use reply_to. List-Unsubscribe conflicts with an
            app that has Thinpost-managed unsubscribe.
          additionalProperties: false
          properties:
            List-Unsubscribe: { type: string }
            List-Unsubscribe-Post: { type: string, const: List-Unsubscribe=One-Click }
            In-Reply-To: { type: string }
            References: { type: string }
        attachments:
          type: array
          maxItems: 20
          description: Total decoded size is limited by the operator (5 MiB by default, at most 5.5 MiB).
          items:
            type: object
            additionalProperties: false
            required: [filename, content]
            properties:
              filename: { type: string, minLength: 1, maxLength: 200 }
              content: { type: string, contentEncoding: base64, description: Canonical standard base64. }
              content_type: { type: string, description: Inferred from the filename when omitted. }
              content_id: { type: string, maxLength: 128, description: Makes the attachment inline; requires html. }
        enhanced_protection: { type: boolean, description: "Require TLS to the recipient's server (Enhanced Protection)." }
        tracking:
          type: object
          additionalProperties: false
          description: Per-kind choice overriding the app default. Opting in requires html and tracking to be enabled on the deployment.
          properties:
            opens: { type: boolean }
            clicks: { type: boolean }
        hold: { type: boolean, description: 'Accept on hold: stored and counted, but not sent until released.' }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
